name: Build

on:
  workflow_dispatch:
  # ריצה אוטומטית בכל שינוי בקוד (בלי קבצי תיעוד); תג v* מפרסם גם Release
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
      - 'LICENSE'
    tags: ['v*']

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
          - os: macos-latest
            platform: macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: הפעלת פלטפורמת שולחן עבודה
        run: flutter config --enable-${{ matrix.platform }}-desktop

      - run: flutter pub get

      - name: ניתוח סטטי
        run: flutter analyze
        continue-on-error: true

      - run: flutter test

      - name: בנייה
        run: flutter build ${{ matrix.platform }} --release

      # אריזה (Windows): exe יחיד שרץ בלי התקנה (7-Zip SFX). הוא מחלץ את עצמו לתיקייה זמנית
      # ומריץ משם; התוכנה מזהה את ה-exe המקורי ושומרת את ה-PAK לידו.
      - name: אריזת exe יחיד (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          Invoke-WebRequest https://www.7-zip.org/a/7zr.exe -OutFile 7zr.exe
          Invoke-WebRequest https://www.7-zip.org/a/lzma2301.7z -OutFile lzma.7z
          ./7zr.exe x -y -olzma lzma.7z | Out-Null
          # אייקון התוכנה גם על קובץ ה-exe היחיד
          Invoke-WebRequest https://github.com/electron/rcedit/releases/download/v2.0.0/rcedit-x64.exe -OutFile rcedit.exe
          # מניפסט asInvoker: בלעדיו Windows מזהה את השם "Update" כתוכנת התקנה ומציג מגן UAC ואישור מנהל
          ./rcedit.exe lzma/bin/7zS2.sfx --set-icon windows/runner/resources/app_icon.ico --application-manifest windows/runner/sfx.manifest
          ./7zr.exe a -mx=9 payload.7z ./build/windows/x64/runner/Release/* | Out-Null
          $cfg = ";!@Install@!UTF-8!`nTitle=`"עדכון אופליין - מאגר ספרים`"`nRunProgram=`"books_offline_update.exe`"`nGUIMode=`"2`"`n;!@InstallEnd@!`n"
          [IO.File]::WriteAllText("$PWD\cfg.txt", $cfg, (New-Object Text.UTF8Encoding($false)))
          $out = [IO.File]::Create("$PWD\BooksOfflineUpdate.exe")
          foreach ($f in @("lzma/bin/7zS2.sfx", "cfg.txt", "payload.7z")) {
            $b = [IO.File]::ReadAllBytes("$PWD\$f"); $out.Write($b, 0, $b.Length)
          }
          $out.Close()
          Get-Item BooksOfflineUpdate.exe | Select-Object Name, Length

      # אריזה (macOS) - ללא חתימה; Gatekeeper יתריע בפעם הראשונה (ראו README)
      - name: אריזת zip (macOS)
        if: matrix.platform == 'macos'
        run: ditto -c -k --keepParent build/macos/Build/Products/Release/*.app BooksOfflineUpdate-macos.zip

      - uses: actions/upload-artifact@v4
        with:
          name: BooksOfflineUpdate-${{ matrix.platform }}
          path: |
            BooksOfflineUpdate.exe
            BooksOfflineUpdate-macos.zip
          if-no-files-found: ignore

  release:
    # יצירת Release רק בריצת תג
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/BooksOfflineUpdate.exe
            dist/BooksOfflineUpdate-macos.zip
